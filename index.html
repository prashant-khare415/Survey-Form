<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survey Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="form">
        <h2>Survey Form</h2>
    <div class="basicInfo"> 
        <div class="name">
        <label>
            Name :<br>
            <input type="text" placeholder="  Enter your name" id="Info">
        </label>
    </div>
    <div class="email">
        <label>
            Email :<br>
            <input type="email" placeholder="  abc@gmail.com" id="Info">
        </label>
    </div>
    <div class="age">
        <label>
            Age :<br>
            <input type="number" placeholder="  Enter your age" id="Info">
        </label>
    </div>
    <div class="clg">
        <label>
            College :<br>
            <input type="text" placeholder="  College name" id="Info">
        </label>
    </div>
    </div>
    <div class="option">
        <label>
            Which option best describes you?
            <select name="role" id="role">
                <option value="">Select one option</option>
                <option value="student">Student</option>
                <option value="intern">Intern</option>
                <option value="Prof">Profession</option>
            </select>
        </label>
    </div>
    <div class="lang-container">
    <p>Languages known (Check all that apply)</p>
    <div class="lang-options">
        <div class="option-item">
            <input type="checkbox" name="languages" id="lang-c" value="c">
            <label for="lang-c">C</label>
        </div>

        <div class="option-item">
            <input type="checkbox" name="languages" id="lang-cpp" value="cpp">
            <label for="lang-cpp">C++</label>
        </div>

        <div class="option-item">
            <input type="checkbox" name="languages" id="lang-java" value="java">
            <label for="lang-java">Java</label>
        </div>

        <div class="option-item">
            <input type="checkbox" name="languages" id="lang-python" value="python">
            <label for="lang-python">Python</label>
        </div>

        <div class="option-item">
            <input type="checkbox" name="languages" id="lang-sql" value="sql">
            <label for="lang-sql">SQL</label>
        </div>
    </div>
</div>
    <div class="admission">
            <p>Do you want to take admission</p>
            <input type="radio" name="feedback" id="yes" value="yes">
            <label for="yes">Yes</label><br>

            <input type="radio" name="feedback" id="no" value="no">
            <label for="no">No</label><br>

            <input type="radio" name="feedback" id="later" value="later">
            <label for="later">Later</label><br>
    </div>
    <div class="feedback">
        <label for="feedback">Give us feedback :</label><br>
            <textarea id="feedback" placeholder="  Write your feedback"></textarea>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    </div>
</body>
</html>
